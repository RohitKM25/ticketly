<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticketly - Available Shows</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-mono p-10">
    <div class="max-w-xl mx-auto">
        <h1 class="text-2xl font-bold border-b-2 pb-3 mb-6">[ TICKETLY // SHOWS ]</h1>
        <div th:each="show : ${shows}" class="border p-5 mb-4">
            <h3 class="text-lg font-bold mb-2" th:text="${show.movieTitle}">Movie Title</h3>
            <p class="mb-4">Total Seats: <span th:text="${show.totalSeats}">100</span></p>
            <a th:href="@{/shows/{id}/book(id=${show.id})}" class="inline-block px-4 py-2 border font-bold">Book Seat</a>
        </div>
    </div>
</body>
</html>
