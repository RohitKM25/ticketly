services:
  postgres:
    image: 'postgres:alpine'
    environment:
      - 'POSTGRES_DB=ticketly'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ticketly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:alpine'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ticketly-net

volumes:
  postgres_data:
  redis_data:
     
networks:
  ticketly-net:
    driver: bridge

