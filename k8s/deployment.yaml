apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketly-app
  labels:
    app: ticketly-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketly-app
  template:
    metadata:
      labels:
        app: ticketly-app
    spec:
      containers:
      - name: app
        image: rohitkm25/ticketly:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/ticketly"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "password"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: ticketly-app-service
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: ticketly-app
